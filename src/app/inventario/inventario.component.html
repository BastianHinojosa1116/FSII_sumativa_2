<div class="container mt-4">
  <h1 class="text-center">Inventario</h1>

  <!-- BUSCADOR -->
  <div class="input-group mb-3">
    <span class="input-group-text"><i class="bi bi-search"></i></span>
    <input
      type="text"
      class="form-control"
      placeholder="Buscar producto..."
      [(ngModel)]="searchTerm"
    />
  </div>

  <div class="row justify-content-center">
    <div
      class="col-12 col-md-6 col-lg-4 mb-4 d-flex"
      *ngFor="let item of filteredItems; let i = index"
    >
      <div class="card shadow-sm flex-fill">
        <div class="card-body d-flex flex-column">
          <!-- CONTENIDO PRINCIPAL -->
          <div class="text-content mb-3">
            <h5 class="card-title">{{ item.nombre }}</h5>
            <p class="card-text">
              Cantidad:
              <strong id="cantidad-{{ i }}">{{ item.cantidad }}</strong>
            </p>
            <input
              type="number"
              class="form-control mb-2"
              placeholder="Ingrese cantidad"
              [(ngModel)]="inputQuantities[i]"
            />
            <div class="d-flex gap-2">
              <button class="btn btn-success" (click)="sumar(i)">+</button>
              <button class="btn btn-danger"  (click)="restar(i)">-</button>
            </div>
          </div>
          <!-- IMAGEN -->
          <div class="image-container mt-auto">
            <img
              [src]="item.imagen"
              alt="{{ item.nombre }}"
              class="product-img img-fluid"
              (error)="item.imagen='assets/images/nofoto.png'"
            />
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
